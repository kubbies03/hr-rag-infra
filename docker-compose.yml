services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-rag-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ANONYMIZED_TELEMETRY: "False"
      DATABASE_URL: sqlite:////app/data/sqlite/hr.db
      CHROMA_PERSIST_DIR: /app/data/chroma
      DOCS_DIR: /app/data/docs
    volumes:
      - ./data/sqlite:/app/data/sqlite
      - ./data/chroma:/app/data/chroma
      - ./data/docs:/app/data/docs
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks:
      - hr-rag-net

  nginx:
    image: nginx:1.27-alpine
    container_name: hr-rag-nginx
    restart: unless-stopped
    depends_on:
      rag-api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hr-rag-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hr-rag-prometheus
    restart: unless-stopped
    depends_on:
      rag-api:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - hr-rag-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: hr-rag-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - hr-rag-net

networks:
  hr-rag-net:
    driver: bridge

volumes:
  grafana-data:
